
name: Prueba detector EV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  probar_detector:

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Consultar cuotas deportivas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python detector.py


      - name: Probar notificacion Telegram
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          mensaje = "Sistema EV Multideporte: prueba de Telegram exitosa."

          datos = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": mensaje
          }).encode()

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          solicitud = urllib.request.Request(url, data=datos)

          with urllib.request.urlopen(solicitud, timeout=20) as respuesta:
              resultado = json.load(respuesta)
              if not resultado.get("ok"):
                  raise RuntimeError("Telegram no confirmo el envio")

          print("Mensaje de prueba enviado correctamente")
          PY
          
